<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>남도187 | 카테고리</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500&display=swap');
    *{box-sizing:border-box}
    body{margin:0;background:#f5f3ed;color:#1d2920;font-family:'Noto Sans KR',sans-serif}
    .top{background:#203c2c;color:#fff;padding:28px 7vw;display:flex;justify-content:space-between;align-items:center}
    .brand{font:26px 'DM Serif Display',serif}
    .brand b{color:#e7ca70;font-weight:400}
    a{text-decoration:none;color:inherit}
    .back{font-size:13px}
    .wrap{max-width:1100px;margin:auto;padding:90px 7vw}
    .eyebrow{font-size:11px;letter-spacing:2px;color:#647065}
    .wrap h1{font:clamp(46px,6vw,72px)/1.1 'DM Serif Display','Noto Sans KR',serif;font-weight:400;margin:16px 0 55px}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .card{min-height:250px;background:#fff;padding:37px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
    .card:hover{transform:translateY(-4px);box-shadow:0 15px 30px #1c2c2114}
    .num{font:14px 'DM Serif Display';color:#b48d2a}
    .card h2{font:32px 'DM Serif Display','Noto Sans KR',serif;font-weight:400;margin:10px 0}
    .card p{color:#657168;font-size:14px;line-height:1.8;margin:0}
    .arrow{font-size:22px;margin-top:25px}
    @media(max-width:600px){.wrap{padding:60px 7vw}.cards{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand">NAMDO <b>187</b></a>
    <a href="index.html" class="back">← 홈페이지로</a>
  </header>
  <main class="wrap">
    <p class="eyebrow">EXPLORE NAMDO 187</p>
    <h1>남도187의<br>공간을 만나보세요.</h1>
    <section class="cards">
      <a class="card" href="index.html#stay">
        <span class="num">01</span>
        <div><h2>STAY</h2><p>한 팀만을 위한 독채 객실과 편안한 실내 공간</p></div>
        <span class="arrow">↗</span>
      </a>
      <a class="card" href="index.html#space">
        <span class="num">02</span>
        <div><h2>SPACE</h2><p>테라스 바비큐, 노래방, 캠프파이어가 있는 야외 공간</p></div>
        <span class="arrow">↗</span>
      </a>
      <a class="card" href="index.html#guide">
        <span class="num">03</span>
        <div><h2>GUIDE</h2><p>체크인과 예약, 찾아오는 길 안내</p></div>
        <span class="arrow">↗</span>
      </a>
      <a class="card" href="https://booking.ddnayo.com/?accommodationId=106652" target="_blank" rel="noreferrer">
        <span class="num">04</span>
        <div><h2>RESERVATION</h2><p>예약 가능 날짜와 이용 요금을 확인하세요.</p></div>
        <span class="arrow">↗</span>
      </a>
    </section>
  </main>
</body>
</html>
